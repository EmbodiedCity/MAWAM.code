# MAWAM Stage 1 Training Configuration (Paper Section 4.3 & Appendix Table 6)
# N = 1: single-robot trajectories with shared weights and embodiment masks
# (1:1 embodiment sampling ratio on heterogeneous robot teams).

stage: 1
num_agents: 1

backbone:
  base_model_repo: "robbyant/lingbot-va-base"
  num_layers: 30
  num_attention_heads: 24
  attention_head_dim: 128
  in_channels: 48
  out_channels: 48
  patch_size: [1, 2, 2]
  action_dim: 30
  action_per_frame: 16
  text_dim: 4096
  ffn_dim: 14336
  video_fps: 6.25
  control_hz: 25.0

optimization:
  world_size: 8
  episodes_per_gpu: 1
  global_batch_size: 8
  updates: 3000
  save_interval: 1000
  optimizer: "adamw"
  lr: 1.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.1
  eps: 1.0e-8
  grad_clip: 2.0
  warmup_steps: 0
  lr_schedule: "constant"
  precision: "bfloat16"
  fsdp: true
  activation_checkpointing: "all"

diffusion:
  num_train_timesteps: 1000
  video_snr_shift: 5.0
  action_snr_shift: 1.0
  sigma_min: 0.0
  extra_one_step: true
  cfg_dropout_prob: 0.1
  clean_video_noise_prob: 0.5
  chunk_size_range: [1, 4]
  window_size_range: [4, 64]

data:
  demo_pairs_per_task: 100
  heterogeneous_sampling_ratio: [1, 1]
  action_clip: 5.0
  mask_missing_wrist_loss: true
  rezero_inactive_action_slots: true
  seed: 42
