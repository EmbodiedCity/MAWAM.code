# MAWAM Closed-Loop Benchmark Inference Configuration (Paper Section 4.4 & Appendix Table 6)

preset: "benchmark"
dtype: "bfloat16"

chunk_frames: 2            # C = 2 latent frames -> 32 control steps (1.28 s @ 25 Hz)
action_per_frame: 16
window_frames: 64          # W = 64 sliding joint KV cache
control_hz: 25.0
video_fps: 6.25

video_inference_steps: 25
video_guidance_scale: 5.0
video_snr_shift: 5.0

action_inference_steps: 50
action_guidance_scale: 1.0
action_snr_shift: 1.0

rezero_inactive_action_every_step: true
pin_initial_observation: true
use_cuda_graphs: false
use_fused_qkv: false
use_compiled_rope: false
cache_text_kv: true
